<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar produto</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
        nav { margin-bottom: 24px; }
        nav a { color: #075985; margin-right: 16px; }
        form { display: grid; gap: 14px; }
        label { display: grid; gap: 6px; font-weight: 600; }
        input, textarea, button { font: inherit; padding: 10px; }
        button { cursor: pointer; }
        #mensagem { min-height: 1.5em; }
        .erro { color: #b91c1c; }
    </style>
</head>
<body>
    <nav><a href="/">Produtos</a></nav>
    <main>
        <h1>Cadastrar produto</h1>
        <form id="form-produto">
            <label for="nome">Nome *
                <input id="nome" name="nome" maxlength="100" required>
            </label>
            <label for="preco">Preço *
                <input id="preco" name="preco" type="number" min="0" step="0.01" required>
            </label>
            <label for="quantidade">Quantidade *
                <input id="quantidade" name="quantidade" type="number" min="0" step="1" required>
            </label>
            <label for="categoria">Categoria
                <input id="categoria" name="categoria" maxlength="50">
            </label>
            <label for="descricao">Descrição
                <textarea id="descricao" name="descricao" rows="4"></textarea>
            </label>
            <button type="submit">Cadastrar</button>
        </form>
        <p id="mensagem" role="status" aria-live="polite"></p>
    </main>
    <script>
        const form = document.querySelector("#form-produto");
        const mensagem = document.querySelector("#mensagem");

        form.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            mensagem.textContent = "";
            mensagem.className = "";

            const dados = Object.fromEntries(new FormData(form));
            dados.preco = Number(dados.preco);
            dados.quantidade = Number(dados.quantidade);

            try {
                const resposta = await fetch("/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
                const resultado = await resposta.json();
                if (!resposta.ok) {
                    throw new Error(resultado.erro || "Não foi possível cadastrar o produto.");
                }
                window.location.href = "/";
            } catch (erro) {
                mensagem.textContent = erro.message;
                mensagem.className = "erro";
            }
        });
    </script>
</body>
</html>
